name: ci
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch)
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check realmweaver tests && uv run ruff format --check realmweaver tests
      - name: Secret scan
        run: |
          if git grep -nE 'hf_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}' -- ':!docs/research/*' ; then echo "secret-looking string found"; exit 1; fi
      - name: Tests (CPU)
        run: uv run pytest -m "not gpu" --cov=realmweaver --cov-report=term-missing
