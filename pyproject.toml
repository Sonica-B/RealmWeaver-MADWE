[project]
name = "realmweaver"
version = "0.2.0"
description = "RealmWeaver (MADWE): multi-agent diffusion world engine for coherent 2D game assets, WFC layouts and Unity streaming"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Shreya Boyane" }, { name = "Ankit Gole" }]
dependencies = [
  "numpy>=2.0",
  "pillow>=11.0",
  "pyyaml>=6.0",
  "networkx>=3.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "websockets>=14",
  "pydantic>=2.9",
  "torch>=2.11",
  "torchvision>=0.26",
  "diffusers>=0.41",
  "transformers>=5.0",
  "peft>=0.21",
  "accelerate>=1.10",
  "safetensors>=0.5",
  "huggingface-hub>=1.0",
  "torchmetrics>=1.9",
  "torch-fidelity>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.14", "httpx>=0.28"]

[project.scripts]
realmweaver = "realmweaver.cli:main"

[project.urls]
Repository = "https://github.com/Sonica-B/RealmWeaver-MADWE"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["realmweaver"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA device; skipped elsewhere"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data", "unity", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
